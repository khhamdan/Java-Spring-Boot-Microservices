spring.application.name=gateway
server.port=8084



#Eureka
#To register this as a client, what propertise do I need
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
#url used by microservice to register as client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#true for both because we need to register with eureka and fetch the registry

#Zipkin
management.tracing.sampling.probability=1.0

#Gatway
spring.cloud.gateway.routes[0].id=company-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/companies/**

spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**

spring.cloud.gateway.routes[2].id=review-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/reviews/**

# Logging
logging.level.root=info
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway = TRACE




